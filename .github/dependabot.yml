# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The frameworks of the fixtures of the end to end tests: their new versions are tested by the pull requests of
  # Dependabot before the users get them.
  - package-ecosystem: "npm"
    directories:
      - "/tests/org.eclipse.evitest.tests/fixtures/vitest"
      - "/tests/org.eclipse.evitest.tests/fixtures/jest"
      - "/tests/org.eclipse.evitest.tests/fixtures/mocha"
      - "/tests/org.eclipse.evitest.tests/fixtures/jasmine"
      - "/tests/org.eclipse.evitest.tests/fixtures/playwright"
    schedule:
      interval: "weekly"
    groups:
      frameworks:
        patterns:
          - "*"
